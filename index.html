<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="SPONDEX 的个人主页，用来记录项目、想法和正在学习的东西。"
    />
    <meta name="theme-color" content="#0b1020" />
    <title>SPONDEX — 个人主页</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b1020'/%3E%3Cpath d='M18 18h28v8H26v12h20v8H18z' fill='%237ce7ff'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
        --ink: #f5f7ff;
        --muted: #9aa6bd;
        --line: rgba(255, 255, 255, 0.12);
        --accent: #7ce7ff;
        --accent-deep: #081c27;
        --surface: rgba(11, 16, 32, 0.78);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: #080c18;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background:
          radial-gradient(circle at 82% 14%, rgba(48, 194, 232, 0.15), transparent 30rem),
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          #080c18;
        background-size: auto, 52px 52px, 52px 52px, auto;
      }

      a {
        color: inherit;
      }

      .shell {
        width: min(1080px, calc(100% - 40px));
        min-height: 100vh;
        margin: 0 auto;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      header,
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 84px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .mark {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--ink);
        font-weight: 750;
        text-decoration: none;
        letter-spacing: -0.02em;
      }

      .mark::before {
        content: "";
        width: 10px;
        height: 10px;
        border: 2px solid var(--accent);
        border-radius: 3px;
        box-shadow: 4px 4px 0 var(--accent);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 9px;
      }

      .status::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 0 5px rgba(124, 231, 255, 0.09);
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 260px;
        gap: clamp(56px, 10vw, 132px);
        align-items: center;
        padding: 72px 0 96px;
      }

      .eyebrow {
        margin: 0 0 22px;
        color: var(--accent);
        font: 700 0.78rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 780px;
        margin: 0;
        font-size: clamp(3.6rem, 9.5vw, 7.8rem);
        line-height: 0.9;
        letter-spacing: -0.072em;
      }

      .intro {
        max-width: 620px;
        margin: 32px 0 0;
        color: var(--muted);
        font-size: clamp(1.05rem, 2vw, 1.28rem);
        line-height: 1.75;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 38px;
      }

      .button {
        min-height: 48px;
        padding: 0 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.035);
        font-weight: 700;
        text-decoration: none;
        transition:
          transform 160ms ease,
          border-color 160ms ease,
          background 160ms ease;
      }

      .button.primary {
        border-color: var(--accent);
        color: #061116;
        background: var(--accent);
      }

      .button:hover,
      .button:focus-visible {
        transform: translateY(-2px);
        border-color: var(--accent);
        outline: none;
      }

      .button.primary:hover,
      .button.primary:focus-visible {
        background: #a7efff;
      }

      .card {
        position: relative;
        min-height: 320px;
        padding: 28px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--surface);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.32);
        backdrop-filter: blur(18px);
      }

      .card::before {
        content: "";
        position: absolute;
        width: 150px;
        height: 150px;
        top: -72px;
        right: -58px;
        border: 28px solid rgba(124, 231, 255, 0.09);
        border-radius: 50%;
      }

      .card-label {
        color: var(--muted);
        font: 700 0.72rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      .profile-name {
        margin: 78px 0 0;
        font-size: 1.65rem;
        font-weight: 800;
        letter-spacing: -0.04em;
        overflow-wrap: anywhere;
      }

      .card p {
        margin: 10px 0 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .card-line {
        position: absolute;
        right: 28px;
        bottom: 28px;
        left: 28px;
        height: 1px;
        background: linear-gradient(90deg, var(--accent), transparent);
      }

      footer {
        border-top: 1px solid var(--line);
      }

      footer a {
        text-underline-offset: 4px;
      }

      @media (max-width: 760px) {
        .shell {
          width: min(100% - 32px, 620px);
        }

        header,
        footer {
          min-height: 72px;
        }

        main {
          grid-template-columns: 1fr;
          gap: 48px;
          padding: 60px 0 72px;
        }

        h1 {
          font-size: clamp(3.3rem, 20vw, 5.6rem);
        }

        .card {
          min-height: 240px;
        }

        .profile-name {
          margin-top: 48px;
        }

        footer {
          gap: 24px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <a class="mark" href="/" aria-label="返回主页">SPONDEX</a>
        <span class="status">保持好奇</span>
      </header>

      <main>
        <section aria-labelledby="page-title">
          <p class="eyebrow">Personal space / 个人空间</p>
          <h1 id="page-title">Hello,<br />world.</h1>
          <p class="intro">
            这里记录我的项目、想法和正在学习的东西。保持简单，持续创造。
          </p>
          <div class="actions">
            <a class="button primary" id="github-link" href="https://github.com/">
              查看 GitHub <span aria-hidden="true">↗</span>
            </a>
          </div>
        </section>

        <aside class="card" aria-label="GitHub 个人资料">
          <span class="card-label">GitHub profile</span>
          <div class="profile-name" id="profile-name">@github</div>
          <p>代码、实验与公开笔记。</p>
          <div class="card-line" aria-hidden="true"></div>
        </aside>
      </main>

      <footer>
        <span>© <span id="year"></span></span>
        <a id="footer-link" href="https://github.com/">GitHub</a>
      </footer>
    </div>

    <script>
      const host = window.location.hostname;
      const username = host.endsWith(".github.io") ? host.split(".")[0] : "github";
      const profileUrl = username === "github" ? "https://github.com/" : `https://github.com/${username}`;

      document.querySelector("#year").textContent = new Date().getFullYear();
      document.querySelector("#profile-name").textContent = `@${username}`;
      document.querySelector("#github-link").href = profileUrl;
      document.querySelector("#footer-link").href = profileUrl;
    </script>
  </body>
</html>
